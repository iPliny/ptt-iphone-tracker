  <meta charset="utf-8">

  <link rel="stylesheet" href="prices.css">

</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="back" href="./">← PTT MacShop交易觀測</a> · <a class="back" href="column/">二手 iPhone 行情週報</a>
      <h1>iPhone 歷代官方價格查核表</h1>
    </div>
  </header>
  <main class="wrap" id="prices-main">
    <section class="card" aria-labelledby="lookup-title">
      <h2 id="lookup-title">查詢歷史價目</h2>
      <p id="price-coverage" class="hint" role="status">載入查核資料中…</p>
      <form id="price-filters" class="price-filters" role="search" aria-label="歷史價格篩選">
        <label>價格區塊
          <select id="price-section" name="section">
            <option value="tw-launch">台灣上市價／首發方案（TWD）</option>
            <option value="tw-later">台灣後續容量／調價（TWD）</option>
            <option value="us">初代美國價格（USD）</option>
          </select>
        </label>
        <label>查核狀態
          <select id="price-evidence" name="evidence">
            <option value="A">Apple 原文</option>
            <option value="all">全部查核狀態</option>
            <option value="B">電信官方</option>
            <option value="pending">未核實／不適用</option>
          </select>
        </label>
        <label>機型初發年<select id="price-year" name="year"><option value="">全部年份</option></select></label>
        <label>容量<select id="price-storage" name="storage"><option value="">全部容量</option></select></label>
        <label class="price-search">搜尋機型<input id="price-query" name="q" type="search" maxlength="120" placeholder="例如 16 Pro、SE、XS Max"></label>
        <label>排序<select id="price-sort" name="sort"><option value="newest">初發年：新到舊</option><option value="oldest">初發年：舊到新</option><option value="price-asc">金額：低到高</option><option value="price-desc">金額：高到低</option></select></label>
        <button type="reset" class="ghost">重設篩選</button>
      </form>
      <p id="price-result" class="hint" role="status" aria-live="polite"></p>
      <p class="hint">手機版表格可左右捲動，查看適用日期與來源連結。</p>
      <div class="scroll" id="price-table-scroll" role="region" aria-label="價格表，可橫向捲動" tabindex="0">
        <table id="price-table">
          <caption id="price-caption">歷史價格查核明細</caption>
          <thead><tr><th scope="col">初發年／機型</th><th scope="col">容量</th><th scope="col" class="num">金額</th><th scope="col">時點／價格類型</th><th scope="col">查核狀態／來源</th></tr></thead>
          <tbody id="price-rows"></tbody>
        </table>
      </div>
      <p id="price-empty" class="empty" hidden>沒有符合條件的資料。可清除機型／容量篩選，或切換全部查核狀態。</p>
      <p id="price-error" role="alert" hidden>價格資料載入失敗。</p>
      <button id="price-retry" type="button" class="ghost" hidden>重新載入</button>
      <noscript><p>此查詢表需要 JavaScript。</p></noscript>
    </section>
  </main>
  <footer class="wrap foot"><p><a href="./">回到 PTT MacShop交易觀測</a> · 各筆記錄附價格來源。</p><p class="by-crawlsnek">由 <a href="https://crawlsnek.com/">CrawlSnek</a> 提供</p></footer>
</body>
</html>
