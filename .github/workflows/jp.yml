name: 日本買取價

on:
  schedule:
    # 日本時間 09:17／15:17／21:17；避開整點尖峰，降低延遲與漏跑風險，但不保證準時。
    # GitHub schedule 仍可能延遲或漏跑；晚到的抓取照常執行，實際時間以 runs.csv 為準。
    # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#schedule
    - cron: "17 0,6,12 * * *"
  workflow_dispatch:

env:
  TZ: Asia/Tokyo

permissions:
  contents: write
  actions: write

concurrency:
  group: jp
  cancel-in-progress: false

jobs:
  buyback:
    # 分支上的手動驗收不可寫 main，也不可觸發正式部署。
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 依序抓取日本買取價
        run: python jp/buyback.py
      - name: 只提交日本資料並重新部署
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "ptt-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jp/
          if git diff --cached --quiet; then
            echo "日本資料沒有變動。"
            exit 0
          fi
          git commit -m "日本買取價更新 $(TZ=Asia/Tokyo date '+%F %H:%M')"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              gh workflow run pages.yml --ref main
              exit 0
            fi
            sleep 15
          done
          echo "推送失敗" >&2
          exit 1
