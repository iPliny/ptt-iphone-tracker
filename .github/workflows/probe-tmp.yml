name: probe-tmp
on:
  push:
    branches: [fix-price-30C]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: |
          python - <<'PY'
          import tracker as T
          c, h = T.fetch("https://www.ptt.cc/bbs/MacShop/M.1790391324.A.30C.html")
          a = T.parse_article(h)
          print(a["title"]); print(repr(a["body"])); print(a["last_edit"])
          print(T.rule_extract(a["title"], a["body"]))
          PY
