name: probe skipped
on: push
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/claude/probe-skipped'
    env:
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: |
          python - <<'P'
          import tracker as T
          for p in ["M.1793256443.A.38B"]:
              code, html = T.fetch(T.BASE_URL + "/bbs/MacShop/" + p + ".html")
              print("=====", p, code)
              art = T.parse_article(html) if code == 200 else None
              if not art: continue
              print("TITLE:", art["title"])
              print(art["body"][:2500])
              print("--- rule:", T.rule_extract(art["title"], art["body"]))
              print("--- not_single:", T.not_single_iphone(art), T.extract_items(art["title"], art["body"]))
          P
