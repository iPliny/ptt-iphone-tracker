name: 販賣價探測（暫時）
on:
  push:
    branches: [claude/retail-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install curl_cffi
      - run: python probe/retail_probe.py
