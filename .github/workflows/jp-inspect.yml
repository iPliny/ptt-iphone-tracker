name: JP crawler acceptance (temporary)
on:
  push:
    branches: [codex/jp-buyback-phase1]
    paths: [.github/workflows/jp-inspect.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Actual crawler dry run (no CSV, no commit, no deployment)
        run: |
          python jp/buyback.py --dry-run | tee /tmp/jp-acceptance.json
          git diff --exit-code -- data/
          test ! -d data/jp
      - name: Price summary
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          results=json.loads(Path("/tmp/jp-acceptance.json").read_text())
          lines=["## 日本爬蟲實際驗收（dry-run）", "", "| 店家 | 狀態 | 筆數 |", "|---|---|---|"]
          for r in results: lines.append(f"| {r['shop']} | {r['status']} | {len(r['rows'])} |")
          lines += ["", "| 店家 | 機型 | 容量 | 未開封 SIMフリー 主價 |", "|---|---|---|---|"]
          for result in results:
              for r in result["rows"]:
                  if r["condition"]=="未開封" and r["carrier"]=="SIMフリー" and not r["color"]:
                      lines.append(f"| {r['shop']} | {r['model']} | {r['storage']} | ¥{r['price_jpy']:,} |")
          text="\n".join(lines)+"\n"
          print(text)
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(text)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: jp-crawler-acceptance
          path: /tmp/jp-acceptance.json
          retention-days: 7
