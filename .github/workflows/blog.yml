# Blogger「iPhone二手週報」轉貼：讀部落格公開 feed，有新文章或修改就 commit 到 data/blog/ 並重新部署網站。
name: 週報轉貼

on:
  schedule:
    - cron: "30 12 * * *"   # 每天 UTC 12:30 = 日本時間 21:30 = 台灣時間 20:30（週日週報約 20:00 JST 發布）
  workflow_dispatch:

env:
  TZ: Asia/Taipei

permissions:
  contents: write
  actions: write

concurrency:
  group: blog
  cancel-in-progress: false

jobs:
  blog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 同步 Blogger 週報
        run: python site/blog.py
      - name: Commit 並重新部署網站
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "ptt-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/blog/
          if git diff --cached --quiet; then
            echo "沒有新文章或修改。"
            exit 0
          fi
          git commit -m "週報轉貼 $(TZ=Asia/Taipei date '+%F %H:%M')"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              gh workflow run pages.yml --ref main
              exit 0
            fi
            sleep 15
          done
          echo "推送失敗" >&2
          exit 1
