name: Probe empty titles (temporary)

on:
  push:
    branches: [claude/project-thread-db6v0x]
    paths: [.github/workflows/probe-titles.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Print page structure of empty-title articles
        run: |
          python - <<'PY'
          import re, time
          from bs4 import BeautifulSoup
          import tracker
          for u in ["M.1791773214.A.CA8", "M.1791628103.A.164", "M.1790828999.A.2C0"]:
              code, html = tracker.fetch(f"https://www.ptt.cc/bbs/MacShop/{u}.html")
              print("=====", u, code)
              soup = BeautifulSoup(html or "", "html.parser")
              print("TITLE:", soup.title.string if soup.title else None)
              og = soup.find("meta", property="og:title")
              print("OG:", og and og.get("content"))
              main = soup.find(id="main-content")
              if main is not None:
                  for line in main.find_all("div", class_=re.compile("article-metaline")):
                      print("META:", repr(line.get_text(" | ")))
                  print("TEXT:", repr(main.get_text()[:400]))
                  print("TAIL:", repr(main.get_text()[-400:]))
              time.sleep(3)
          PY
