name: Track PTT listings

# 每 6 小時（台灣時間 02/08/14/20 點）掃描 MacShop、回訪在售文章，結果 commit 回 data/
on:
  schedule:
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:
    inputs:
      track_days:
        description: "在售文章發文後持續回訪幾天"
        default: "45"
      days:
        description: "掃描看板時往回看幾天"
        default: "3"
      reparse:
        description: "萃取規則改過後勾選：追蹤期內文章全部重新萃取"
        type: boolean
        default: false

env:
  TZ: Asia/Taipei

permissions:
  contents: read
  actions: write

concurrency:
  group: track
  cancel-in-progress: false

jobs:
  gate:
    # 這一輪若已被排程看門狗補跑過，晚到的 schedule 就略過（.github/schedule_watch.py）
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/schedule_watch.py gate track.yml

  track:
    needs: gate
    if: github.ref == 'refs/heads/main' && needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: 取得私人資料庫
        uses: ./.github/actions/checkout-data
        with:
          token: ${{ secrets.DATA_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Scan and track
        # POYU 2026-10-18：暫不付費，只用規則萃取（secret ANTHROPIC_API_KEY 保留，要恢復時改回 --extractor auto 並帶入 env）
        run: python tracker.py --extractor rules --days "${{ inputs.days || '3' }}" --track-days "${{ inputs.track_days || '45' }}" ${{ inputs.reparse && '--reparse' || '' }}
      - name: 記錄不公開的異常價格
        run: python site/build_site.py --outlier-report
      - name: Commit data and redeploy site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -C data config user.name "ptt-tracker-bot"
          git -C data config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C data add .
          if git -C data diff --cached --quiet; then
            echo "資料沒有變動。"
            exit 0
          fi
          git -C data commit -m "資料更新 $(TZ=Asia/Taipei date '+%F %H:%M')"
          # 期間若有人推送，rebase 後重試
          for attempt in 1 2 3; do
            if git -C data pull --rebase origin main && git -C data push origin HEAD:main; then
              # 用 workflow token 推送不會觸發其他 workflow，所以明確啟動網站部署
              gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main || echo "網站部署未觸發（pages.yml 尚未存在？）"
              exit 0
            fi
            sleep 15
          done
          echo "推送失敗" >&2
          exit 1
      # tracker 的健康警訊不提早中斷，讓異常價格報表、資料提交與部署觸發先完成。
      - name: 檢查執行狀況
        if: ${{ !cancelled() }}
        run: |
          report="$RUNNER_TEMP/track-health.txt"
          if [ ! -f "$report" ]; then
            echo "找不到 tracker 健康檢查結果" >&2
            exit 1
          fi
          cat "$report"
          test "$(head -n 1 "$report")" = "OK"
