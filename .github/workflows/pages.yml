# 原始資料保留在私人儲存庫；Cloudflare 只發布 build_site.py 的公開輸出。
name: 網站部署

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "site/**"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: Asia/Taipei

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 建置並檢查公開產物
        run: |
          python site/build_site.py --out _site
          python - <<'PY'
          from pathlib import Path
          assert not list(Path('_site').rglob('*.csv')), '公開產物不得包含原始 CSV'
          assert not Path('_site/data').exists(), '公開產物不得包含原始資料目錄'
          PY
      - name: 觸發 Cloudflare 正式站建置
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          hook = os.environ['DEPLOY_HOOK']
          if not hook:
              raise SystemExit('尚未設定 CLOUDFLARE_PAGES_DEPLOY_HOOK')
          try:
              with urllib.request.urlopen(urllib.request.Request(hook, data=b'', method='POST'), timeout=60) as r:
                  result = json.load(r)
          except Exception:
              raise SystemExit('Cloudflare 部署觸發失敗；請檢查部署 Hook') from None
          if not result.get('success'):
              raise SystemExit('Cloudflare 未接受部署要求')
          print('Cloudflare 已接受正式站建置要求；部署結果請查看 Cloudflare Pages。')
          PY
