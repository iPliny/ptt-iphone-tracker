# 原始資料保留在私人儲存庫；Cloudflare 只發布 build_site.py 的公開輸出。
name: 網站部署

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/actions/checkout-data/**"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: Asia/Taipei

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 取得私人資料庫
        uses: ./.github/actions/checkout-data
        with:
          token: ${{ secrets.DATA_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 建置並檢查公開產物
        run: |
          python site/build_site.py --out _site
          python - <<'PY'
          from pathlib import Path
          assert not list(Path('_site').rglob('*.csv')), '公開產物不得包含原始 CSV'
          assert not Path('_site/data').exists(), '公開產物不得包含原始資料目錄'
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 直接上傳公開網站產物
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name ptt-iphone-tracker --branch main
